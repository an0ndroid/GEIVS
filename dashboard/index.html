<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GEIVS Dashboard</title>
<link rel="icon" type="image/png" href="geivs-logo.png">
<style>
  :root {
    --bg-dark: #080808;
    --card-bg: #111112;
    --card-border: #1c1c1e;
    --gold-main: #C5A059;
    --gold-light: #E5C68A;
    --gold-dim: #8A6D3B;
    --text-white: #EAEAEA;
    --text-muted: #8E8E93;
    --text-green: #30D158;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-family);
    background-color: var(--bg-dark);
    color: var(--text-white);
    padding: 2rem 1.5rem;
    max-width: 900px;
    margin: 0 auto;
  }

  /* --- HEADER --- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
  }

  .header-center {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .logo-img {
    width: 60px;
    height: 60px;
    border: 1px solid var(--gold-main);
    border-radius: 10px;
    object-fit: cover;
    display: block;
  }

  .header-title h1 {
    font-size: 1.4rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--text-white);
    text-transform: uppercase;
  }

  .header-title p {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: var(--gold-main);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--gold-main);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- CHAT CONTAINER --- */
  .chat-container {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .chat-title {
    color: var(--gold-light);
    font-size: 1.25rem;
    font-weight: 400;
    margin-bottom: 1.25rem;
  }

  #chat-log {
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 1rem;
    min-height: 120px;
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 1.25rem;
    white-space: pre-wrap;
    background: #161618;
    color: var(--text-white);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .chat-input-row {
    display: flex;
    gap: 0.75rem;
  }

  #chat-input {
    flex: 1;
    background-color: #161618;
    border: 1px solid #222224;
    border-radius: 8px;
    padding: 0.85rem 1rem;
    color: var(--text-white);
    font-size: 0.9rem;
  }

  #chat-input::placeholder { color: var(--text-muted); }
  #chat-input:focus { outline: none; border-color: var(--gold-dim); }

  #chat-send {
    background-color: var(--gold-main);
    color: #000;
    border: none;
    border-radius: 8px;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }

  #chat-send:hover { background-color: var(--gold-light); }

  /* --- SECTION LABELS --- */
  .section-label {
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: var(--gold-main);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 1rem;
  }

  /* --- QUICK ACTIONS --- */
  #actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem;
    margin-bottom: 2.5rem;
  }

  .action-btn {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 1.25rem 0.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s;
    text-align: center;
  }

  .action-btn:hover {
    border-color: var(--gold-dim);
    background-color: #161618;
  }

  .action-btn svg {
    color: var(--gold-main);
    width: 24px;
    height: 24px;
  }

  .action-btn .btn-title {
    font-size: 0.85rem;
    color: var(--text-white);
    font-weight: 500;
  }

  .action-btn .btn-sub {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* --- RESULTS GRID --- */
  #results {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }

  /* The Daily Brief render is a wide report - give it the full row and let
     the image open full-size in a new tab when clicked. */
  #result-brief { grid-column: 1 / -1; }
  #result-brief img { max-width: 100%; }

  .result {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 200px;
  }

  .result-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-white);
    font-size: 0.9rem;
    margin-bottom: 1rem;
    font-weight: 500;
  }

  .result-label svg {
    color: var(--gold-main);
    width: 18px;
    height: 18px;
  }

  .result-label span {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: normal;
  }

  .body {
    font-size: 1.8rem;
    font-weight: 400;
    margin-bottom: 0.25rem;
  }

  .body.loading {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .body.text {
    font-size: 0.85rem;
    font-weight: 400;
    line-height: 1.5;
    color: var(--text-white);
    white-space: pre-wrap;
  }

  /* --- DYNAMIC WORKFLOW GRAPHICS --- */
  /* Calendar Agenda Layout */
  .agenda { margin-top: 0.5rem; width: 100%; }
  .agenda-day { border-top: 1px solid #222224; padding: 8px 0; }
  .agenda-day-header { font-size: 0.8rem; font-weight: bold; color: var(--gold-light); margin-bottom: 4px; }
  .agenda-day-header.today { color: var(--gold-main); }
  .agenda-event { display: flex; gap: 8px; font-size: 0.8rem; padding: 2px 0; }
  .agenda-event-time { color: var(--text-muted); min-width: 76px; flex-shrink: 0; }

  /* Sales Bar Graph Construction */
  .chart {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 80px;
    margin-top: auto;
    padding-top: 0.5rem;
    border-top: 1px solid #222224;
  }
  .chart-bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
  .chart-bar { width: 100%; max-width: 24px; background: linear-gradient(to top, var(--gold-dim), var(--gold-light)); border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart-bar-label { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; white-space: nowrap; }
  .chart-bar-value { font-size: 0.65rem; color: var(--gold-light); margin-bottom: 2px; }
</style>
</head>
<body>

  <header>
    <button class="icon-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

    <div class="header-center">
      <img src="geivs-logo.png" alt="GEIVS" class="logo-img">
      <div class="header-title">
        <h1 id="assistant-name"></h1>
        <p>Dashboard</p>
      </div>
    </div>

    <button class="icon-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </button>
  </header>

  <div class="chat-container">
    <div class="chat-title" id="chat-title-text"></div>
    <div id="chat-log"></div>
    <div class="chat-input-row">
      <input id="chat-input" type="text">
      <button id="chat-send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <div class="section-label">Quick Actions</div>
  <div id="actions"></div>

  <div class="section-label">Results</div>
  <div id="results"></div>

<script>
// ============================================================
// CUSTOMIZE PER CLIENT HERE: the assistant's display name, shown
// in the header and as the sender label on its chat replies.
// Match whatever persona name was set for this install.
// ============================================================
const ASSISTANT_NAME = 'GEIVS';

document.title = 'GEIVS Dashboard';
document.getElementById('assistant-name').textContent = ASSISTANT_NAME;
document.getElementById('chat-title-text').textContent = 'Ask ' + ASSISTANT_NAME + ' anything...';
document.getElementById('chat-input').placeholder = 'Ask ' + ASSISTANT_NAME + ' anything...';

// ============================================================
// CUSTOMIZE PER CLIENT HERE: one entry per dashboard button.
//   action - must match an action the "Jeeves - Dashboard API"
//            n8n workflow's Switch node handles
//   label / sub - button text shown to the user
//   icon - inline SVG shown on the button and result card
// Add, remove, or reorder entries freely; the buttons and their
// result cards are generated from this list below.
// ============================================================
const BUTTONS = [
  { action: 'brief', label: 'Daily Brief', sub: 'visual report', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line></svg>' },
  { action: 'health', label: 'Server Health', sub: 'live', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>' },
];

// Actions whose result is a multi-sentence paragraph (not a short
// stat/number) get the smaller, readable ".body.text" style instead
// of the large stat-display font.
const LONG_TEXT_ACTIONS = ['unread'];

const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');
const results = document.getElementById('results');

// --- CHAT FUNCTIONS ---
function appendChat(who, text) {
  chatLog.textContent += (chatLog.textContent ? '\n\n' : '') + who + ': ' + text;
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function sendChat() {
  const msg = chatInput.value.trim();
  if (!msg) return;
  appendChat('You', msg);
  chatInput.value = '';
  appendChat(ASSISTANT_NAME, '...thinking...');
  const thinkingRe = new RegExp('\\n\\n' + ASSISTANT_NAME + ': \\.\\.\\.thinking\\.\\.\\.$');
  try {
    const resp = await fetch('api/chat/jeeves-agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session: 'dashboard' })
    });
    const data = await resp.json();
    chatLog.textContent = chatLog.textContent.replace(thinkingRe, '');
    appendChat(ASSISTANT_NAME, data.reply || JSON.stringify(data));
  } catch (e) {
    chatLog.textContent = chatLog.textContent.replace(thinkingRe, '');
    appendChat(ASSISTANT_NAME, 'Error: ' + e.message);
  }
}

chatSend.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

// --- QUICK ACTIONS GENERATOR ---
const actionsEl = document.getElementById('actions');
BUTTONS.forEach(({ action, label, sub, icon }) => {
  const btn = document.createElement('div');
  btn.className = 'action-btn';
  btn.dataset.action = action;
  btn.innerHTML = `${icon}<div class="btn-title">${label}</div><div class="btn-sub">${sub}</div>`;
  btn.addEventListener('click', () => runAction(action));
  actionsEl.appendChild(btn);
});

// --- DAILY BRIEF: fire the visual report (bypasses the LLM) and show the image ---
async function runBrief(bodyEl) {
  bodyEl.className = 'body text';
  bodyEl.textContent = 'Generating your briefing... (about 30-60s)';
  // Note the current image version so we can detect the freshly rendered one.
  let prevLM = null;
  try {
    const r0 = await fetch('briefs/latest.png?probe=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    if (r0.ok) prevLM = r0.headers.get('Last-Modified');
  } catch (e) {}
  try {
    await fetch('api/brief', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: 'dashboard' }) });
  } catch (e) {
    bodyEl.className = 'body';
    bodyEl.textContent = 'Could not start the briefing: ' + e.message;
    return;
  }
  const deadline = Date.now() + 150000;
  (function poll() {
    setTimeout(async () => {
      let ok = false, lm = null;
      try {
        const r = await fetch('briefs/latest.png?probe=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
        ok = r.ok; lm = r.headers.get('Last-Modified');
      } catch (e) {}
      if (ok && lm && lm !== prevLM) {
        bodyEl.className = 'body';
        const v = Date.now();
        bodyEl.innerHTML = '<a href="briefs/latest.png?t=' + v + '" target="_blank" rel="noopener" title="Click to open full size">'
          + '<img src="briefs/latest.png?t=' + v + '" alt="Daily brief (click to enlarge)" style="width:100%;border-radius:8px;display:block;cursor:zoom-in;"></a>';
      } else if (Date.now() < deadline) {
        poll();
      } else {
        bodyEl.textContent = 'The briefing is taking longer than expected - it may have arrived on your Signal instead.';
      }
    }, 4000);
  })();
}

// --- SERVER HEALTH: read the system_health endpoint and render a status tile ---
async function runHealth(bodyEl) {
  bodyEl.className = 'body text';
  bodyEl.textContent = 'Checking server...';
  let d;
  try {
    const r = await fetch('api/health', { cache: 'no-store' });
    d = await r.json();
  } catch (e) {
    bodyEl.className = 'body';
    bodyEl.textContent = 'Could not reach the health service: ' + e.message;
    return;
  }
  const s = d.system || {}, t = d.temps || {};
  const num = (v) => (v === null || v === undefined) ? '?' : v;
  const statusColors = { ok: '#30D158', warn: '#E5C68A', critical: '#FF6B5E' };
  const col = statusColors[d.status] || '#8E8E93';
  const row = (label, val) => '<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:0.85rem;"><span style="color:#8E8E93;">' + label + '</span><span style="text-align:right;">' + val + '</span></div>';
  let html = '<div style="display:inline-block;padding:2px 10px;border-radius:999px;font-size:0.7rem;font-weight:700;letter-spacing:0.08em;color:#000;background:' + col + ';margin-bottom:10px;">' + (d.status || '?').toUpperCase() + '</div>';
  html += row('CPU', num(s.cpu_percent) + '% busy' + (t.cpu_c ? ' &middot; ' + t.cpu_c + '&deg;C' : ''));
  html += row('Load', (s.load ? num(s.load[0]) : '?') + ' &middot; ' + num(s.cores) + ' cores');
  html += row('RAM', num(s.ram_used_gb) + ' / ' + num(s.ram_total_gb) + ' GB (' + num(s.ram_percent) + '%)');
  html += row('Disk', num(s.disk_percent) + '% used &middot; ' + num(s.disk_free_gb) + ' GB free');
  if (t.gpu_c) html += row('GPU', t.gpu_c + '&deg;C');
  (d.disks || []).forEach(function (dk) {
    html += row(dk.device, (dk.health || '?') + (dk.life_remaining_pct != null ? ' &middot; ' + dk.life_remaining_pct + '% life' : ''));
  });
  if (d.containers && d.containers.length) html += row('Containers', d.containers.length + ' up');
  if (d.alerts && d.alerts.length) html += '<div style="margin-top:8px;color:#FF6B5E;font-size:0.8rem;">&#9888; ' + d.alerts.join('; ') + '</div>';
  bodyEl.className = 'body';
  bodyEl.innerHTML = html;
}

// --- BACKEND API RESPONSE & GRAPHICS BUILDER ---
async function runAction(action) {
  const btnData = BUTTONS.find(b => b.action === action) || { label: action, sub: '', icon: '' };
  let box = document.getElementById('result-' + action);

  if (!box) {
    box = document.createElement('div');
    box.id = 'result-' + action;
    box.className = 'result';
    box.innerHTML = `
      <div class="result-label">
        ${btnData.icon} ${btnData.label} <span>${btnData.sub}</span>
      </div>
      <div class="body"></div>
      <div class="chart" style="display:none"></div>
      <div class="agenda" style="display:none"></div>`;
    results.prepend(box);
  }

  const bodyEl = box.querySelector('.body');
  bodyEl.textContent = 'loading...';
  bodyEl.className = 'body loading';

  if (action === 'brief') { runBrief(bodyEl); return; }
  if (action === 'health') { runHealth(bodyEl); return; }

  const chartEl = box.querySelector('.chart');
  chartEl.style.display = 'none';
  chartEl.innerHTML = '';

  const agendaEl = box.querySelector('.agenda');
  agendaEl.style.display = 'none';
  agendaEl.innerHTML = '';

  try {
    const resp = await fetch('api/dashboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action })
    });
    const data = await resp.json();
    const item = Array.isArray(data) ? data[0] : data;
    let text;

    if (action === 'calendar') {
      text = (item.events && item.events.length)
        ? item.events.length + ' event(s) this week'
        : 'Nothing on the calendar this week.';
    } else {
      text = item.summary || JSON.stringify(item);
    }

    bodyEl.className = 'body' + (LONG_TEXT_ACTIONS.includes(action) ? ' text' : '');
    bodyEl.textContent = text;

    // Build Dynamic Calendar Lists if event arrays are returned by n8n
    if (action === 'calendar' && Array.isArray(item.events) && item.events.length) {
      const todayKey = new Date().toDateString();
      const byDay = {};
      item.events.forEach(e => {
        const d = new Date(e.allDay ? e.start + 'T00:00:00' : e.start);
        const key = d.toDateString();
        (byDay[key] = byDay[key] || []).push(e);
      });
      const days = Object.keys(byDay).sort((a, b) => new Date(a) - new Date(b));
      agendaEl.innerHTML = days.map(key => {
        const d = new Date(key);
        const isToday = key === todayKey;
        const dayLabel = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + (isToday ? ' (Today)' : '');
        const events = byDay[key].slice().sort((a, b) => (a.allDay ? -1 : 1) - (b.allDay ? -1 : 1) || new Date(a.start) - new Date(b.start));
        const rows = events.map(e => {
          if (e.allDay) {
            return `<div class="agenda-event"><span class="agenda-event-time">All day</span><span>${e.summary}</span></div>`;
          }
          const time = new Date(e.start).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
          return `<div class="agenda-event"><span class="agenda-event-time">${time}</span><span>${e.summary}</span></div>`;
        }).join('');
        return `<div class="agenda-day">
          <div class="agenda-day-header${isToday ? ' today' : ''}">${dayLabel}</div>
          ${rows}
        </div>`;
      }).join('');
      agendaEl.style.display = 'block';
    }

    // Build Dynamic Bar Charts if numeric sales series are returned by n8n
    if (action === 'sales' && Array.isArray(item.daily) && item.daily.length) {
      const max = Math.max(...item.daily.map(d => d.total), 0.01);
      chartEl.innerHTML = item.daily.map(d => {
        const pct = Math.max((d.total / max) * 100, 2);
        const day = new Date(d.date + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' });
        return `<div class="chart-bar-wrap">
          <div class="chart-bar-value">$${d.total.toFixed(0)}</div>
          <div class="chart-bar" style="height:${pct}%"></div>
          <div class="chart-bar-label">${day}</div>
        </div>`;
      }).join('');
      chartEl.style.display = 'flex';
    }
  } catch (e) {
    bodyEl.className = 'body';
    bodyEl.textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
