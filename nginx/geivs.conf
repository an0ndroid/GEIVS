# =============================================================
# GEIVS Pro — Nginx Reverse Proxy Configuration
# =============================================================

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 100M;

    # --- Root → Open WebUI ---
    location / {
        set $upstream http://openwebui:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Automation → n8n ---
    location /automation/ {
        set $upstream http://n8n:5678;
        rewrite ^/automation/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # --- Image Generation → ComfyUI ---
    location /imagine/ {
        set $upstream http://comfyui:8188;
        rewrite ^/imagine/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        client_max_body_size 500M;
    }

    # --- Social Media → Postiz ---
    location /social/ {
        set $upstream http://postiz:5000;
        rewrite ^/social/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # --- Search → SearXNG ---
    location /search/ {
        set $upstream http://searxng:8080;
        rewrite ^/search/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --- Container Management → Portainer (internal only) ---
    location /portainer/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        set $upstream http://portainer:9000;
        rewrite ^/portainer/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Signal REST API (internal) ---
    location /signal/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        set $upstream http://signal-cli:8080;
        rewrite ^/signal/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Crawl4AI — Web Crawling API (internal) ---
    location /crawl4ai/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        set $upstream http://crawl4ai:11235;
        rewrite ^/crawl4ai/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # --- Uptime Kuma — Monitoring Dashboard ---
    location /monitor/ {
        set $upstream http://uptime-kuma:3001;
        rewrite ^/monitor/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Whisper STT API (internal) ---
    location /whisper/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        set $upstream http://whisper:8000;
        rewrite ^/whisper/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 25M;
    }

    # --- Ollama API (internal) ---
    location /ollama/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        set $upstream http://ollama:11434;
        rewrite ^/ollama/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # --- GEIVS Dashboard — quick-access GUI (optional, jeeves-assistant layer) ---
    # Static files served from ./dashboard (mounted below); buttons/actions are
    # customized per client by editing dashboard/index.html's BUTTONS list, and
    # actions are handled by the "Jeeves - Dashboard API" n8n workflow.
    location /dashboard/api/dashboard {
        set $upstream http://n8n:5678;
        proxy_pass $upstream/webhook/geivs-dashboard;
        proxy_set_header Host $host;
    }

    location /dashboard/api/chat/ {
        set $upstream http://n8n:5678;
        rewrite ^/dashboard/api/chat/(.*)$ /webhook/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location /dashboard/ {
        alias /usr/share/nginx/dashboard/;
        index index.html;
    }
}
