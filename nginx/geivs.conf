# =============================================================
# GEIVS Pro — Nginx Reverse Proxy Configuration
# All services accessible from a single host on clean URLs
# =============================================================

# --- Upstream Services ---
upstream openwebui {
    server openwebui:8080;
}

upstream n8n {
    server n8n:5678;
}

upstream comfyui {
    server comfyui:8188;
}

upstream postiz {
    server postiz:5000;
}

upstream portainer {
    server portainer:9000;
}

upstream searxng {
    server searxng:8080;
}

upstream signal {
    server signal-cli:8080;
}

# =============================================================
# Main GEIVS interface — Open WebUI (primary)
# Access: http://your-server-ip/
# =============================================================
server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # --- Root → Open WebUI ---
    location / {
        proxy_pass http://openwebui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for Open WebUI streaming)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Automation → n8n ---
    location /automation/ {
        proxy_pass http://n8n/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for n8n)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # --- Image Generation → ComfyUI ---
    location /imagine/ {
        proxy_pass http://comfyui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket support (required for ComfyUI live preview)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        client_max_body_size 500M;
    }

    # --- Social Media → Postiz ---
    location /social/ {
        proxy_pass http://postiz/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # --- Search → SearXNG ---
    location /search/ {
        proxy_pass http://searxng/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --- Container Management → Portainer ---
    location /portainer/ {
        proxy_pass http://portainer/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket support (required for Portainer terminal)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Signal REST API (internal use by n8n/agent) ---
    location /signal/ {
        # Restrict to internal network only
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        proxy_pass http://signal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Ollama API (internal use only) ---
    location /ollama/ {
        # Restrict to internal network only
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        proxy_pass http://ollama:11434/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}

