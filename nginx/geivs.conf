# =============================================================
# GEIVS Pro — Nginx Reverse Proxy Configuration
# =============================================================

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 100M;

    # --- Root → GEIVS Dashboard (client web face; static from ./dashboard) ---
    location / {
        root /usr/share/nginx/dashboard;
        index index.html;
    }

    # --- Knowledge base + admin LLM → AnythingLLM ---
    # NOTE: AnythingLLM under a path prefix may need base-path config; if its
    # assets 404, serve it on its own subdomain/port instead of /knowledge/.
    location /knowledge/ {
        set $upstream http://anythingllm:3001;
        rewrite ^/knowledge/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # --- Dashboard API → n8n webhooks (lazy-resolved via $upstream + resolver) ---
    location /api/dashboard {
        set $upstream http://n8n:5678;
        proxy_pass $upstream/webhook/geivs-dashboard;
        proxy_set_header Host $host;
    }
    location /api/chat/ {
        set $upstream http://n8n:5678;
        rewrite ^/api/chat/(.*)$ /webhook/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
    location /api/brief {
        set $upstream http://n8n:5678;
        proxy_pass $upstream/webhook/jeeves-brief-test;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # --- Server health tile → host system_health service (:4090) ---
    # system_health stays a HOST service; reached via the docker host gateway.
    # Requires: extra_hosts "host.docker.internal:host-gateway" on the nginx
    # service, AND the host system_health bound to an interface the containers
    # can reach (installer sets GEIVS_BINDS=0.0.0.0 for it). Static proxy_pass so
    # it resolves from /etc/hosts, not the resolver.
    location /api/health {
        proxy_pass http://host.docker.internal:4090/health.json;
        proxy_set_header Host $host;
    }

    # --- Rendered briefing PNG (geivs-render writes latest.png to briefs vol) ---
    location /briefs/ {
        alias /usr/share/nginx/briefs/;
    }

    # --- Automation → n8n ---
    location /automation/ {
        set $upstream http://n8n:5678;
        rewrite ^/automation/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # --- Image Generation → ComfyUI ---
    location /imagine/ {
        set $upstream http://comfyui:8188;
        rewrite ^/imagine/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        client_max_body_size 500M;
    }

    # --- Social Media → Postiz ---
    location /social/ {
        set $upstream http://postiz:5000;
        rewrite ^/social/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # --- Search → SearXNG ---
    location /search/ {
        set $upstream http://searxng:8080;
        rewrite ^/search/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --- Container Management → Portainer (internal only) ---
    location /portainer/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        set $upstream http://portainer:9000;
        rewrite ^/portainer/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Signal REST API (internal) ---
    location /signal/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        set $upstream http://signal-cli:8080;
        rewrite ^/signal/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Crawl4AI — Web Crawling API (internal) ---
    location /crawl4ai/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        set $upstream http://crawl4ai:11235;
        rewrite ^/crawl4ai/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # --- Uptime Kuma — Monitoring Dashboard ---
    location /monitor/ {
        set $upstream http://uptime-kuma:3001;
        rewrite ^/monitor/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Whisper STT API (internal) ---
    location /whisper/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        set $upstream http://whisper:8000;
        rewrite ^/whisper/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 25M;
    }

    # --- Ollama API (internal) ---
    location /ollama/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        set $upstream http://ollama:11434;
        rewrite ^/ollama/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

}
